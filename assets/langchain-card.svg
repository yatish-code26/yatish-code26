<svg width="100%" height="100%" viewBox="0 0 585 290" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="lcBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090E1A"/>
      <stop offset="100%" stop-color="#120E22"/>
    </linearGradient>

    <linearGradient id="lcBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C084FC" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#818CF8" stop-opacity="0.4"/>
    </linearGradient>

    <style>
      .mono { font-family: "JetBrains Mono", "Fira Code", Menlo, Consolas, monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, Helvetica, Arial, sans-serif; }
    </style>
  </defs>

  <!-- Container -->
  <rect width="585" height="290" rx="14" fill="url(#lcBg)"/>
  <rect x="1" y="1" width="583" height="288" rx="13" fill="none" stroke="url(#lcBorder)" stroke-width="1.2"/>

  <!-- Content -->
  <g transform="translate(28, 28)">
    <!-- Badge -->
    <rect x="0" y="0" width="220" height="24" rx="12" fill="#201133" stroke="#A855F7" stroke-width="1"/>
    <circle cx="12" cy="12" r="3.5" fill="#C084FC"/>
    <text x="22" y="16" fill="#E9D5FF" font-size="10.5" font-weight="700" class="mono" letter-spacing="0.8">OPEN SOURCE // IN PROGRESS</text>

    <!-- Title -->
    <text x="0" y="60" fill="#FFFFFF" font-size="24" font-weight="800" class="sans" letter-spacing="-0.5">
      LangChain Ecosystem
    </text>
    <text x="280" y="58" fill="#C084FC" font-size="12" font-weight="600" class="mono">
      langchain-anthropic
    </text>

    <!-- Subtitle -->
    <text x="0" y="86" fill="#CBD5E1" font-size="13" class="sans">
      Upstream partner package contribution to the LangChain framework
    </text>
    <text x="0" y="106" fill="#CBD5E1" font-size="13" class="sans">
      focusing on Anthropic Claude model thinking configuration integrity.
    </text>

    <!-- Branch & PR Context Box -->
    <g transform="translate(0, 126)">
      <rect width="529" height="58" rx="8" fill="#0E0B1A" stroke="#2D1F47" stroke-width="1"/>
      <text x="14" y="20" fill="#C084FC" font-size="10" font-weight="700" class="mono">ACTIVE BRANCH // PARTNER INTEGRATION</text>
      
      <text x="14" y="42" fill="#E2E8F0" font-size="11.5" class="mono">
        yatish-code26/anthropic/manual-thinking-model-validation
      </text>
    </g>

    <!-- Technical Scope Details -->
    <g transform="translate(0, 198)">
      <circle cx="6" cy="10" r="3" fill="#C084FC"/>
      <text x="16" y="14" fill="#E2E8F0" font-size="12" class="sans">Enforcing adaptive thinking vs manual token budgets on Claude models</text>

      <circle cx="6" cy="30" r="3" fill="#818CF8"/>
      <text x="16" y="34" fill="#E2E8F0" font-size="12" class="sans">Parameterized unit test coverage via pytest, ruff formatting &amp; mypy typing</text>
    </g>
  </g>
</svg>
