<svg width="100%" height="100%" viewBox="0 0 1200 320" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="lsBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080E18"/>
      <stop offset="60%" stop-color="#0D1624"/>
      <stop offset="100%" stop-color="#070C14"/>
    </linearGradient>

    <linearGradient id="lsBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#059669" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.8"/>
    </linearGradient>

    <linearGradient id="lsTileBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#12202E" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0C1722" stop-opacity="0.5"/>
    </linearGradient>

    <style>
      .mono { font-family: "JetBrains Mono", "Fira Code", Menlo, Consolas, monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, Helvetica, Arial, sans-serif; }
    </style>
  </defs>

  <!-- Container -->
  <rect width="1200" height="320" rx="16" fill="url(#lsBg)"/>
  <rect x="1" y="1" width="1198" height="318" rx="15" fill="none" stroke="url(#lsBorder)" stroke-width="1.5"/>

  <!-- Left Column: Identity & Concept -->
  <g transform="translate(44, 34)">
    <rect x="0" y="0" width="310" height="26" rx="13" fill="#06281E" stroke="#10B981" stroke-width="1"/>
    <circle cx="14" cy="13" r="4" fill="#34D399"/>
    <text x="26" y="17" fill="#6EE7B7" font-size="11" font-weight="700" class="mono" letter-spacing="1">SIH 2026 // MASTER PROTOTYPE</text>

    <!-- Project Title -->
    <text x="0" y="66" fill="#FFFFFF" font-size="32" font-weight="800" class="sans" letter-spacing="-0.8">
      LandStack
    </text>
    <text x="175" y="64" fill="#34D399" font-size="14" font-weight="600" class="mono">
      AI + GIS DIGITAL PUBLIC INFRASTRUCTURE
    </text>

    <!-- Summary -->
    <text x="0" y="98" fill="#CBD5E1" font-size="14.5" class="sans">
      A unified cadastral infrastructure layer solving fragmentation in land governance
    </text>
    <text x="0" y="120" fill="#CBD5E1" font-size="14.5" class="sans">
      by mapping canonical parcel identities (ULPIN) to 11 regulatory domains.
    </text>

    <!-- Core Principle Banner -->
    <g transform="translate(0, 142)">
      <rect width="470" height="64" rx="8" fill="#0C1C1E" stroke="#1E3A3A" stroke-width="1"/>
      <text x="16" y="24" fill="#6EE7B7" font-size="10.5" font-weight="700" class="mono">CANONICAL ARCHITECTURAL AXIOM</text>
      <text x="16" y="46" fill="#F1F5F9" font-size="12.5" font-weight="600" class="mono">
        1 Parcel  ➔  1 Identity (ULPIN)  ➔  11 Layers  ➔  Unified GIS
      </text>
    </g>

    <!-- Tech Stack Pill Row -->
    <g transform="translate(0, 222)">
      <rect x="0" y="0" width="76" height="26" rx="6" fill="#0B1A24" stroke="#1E293B" stroke-width="1"/>
      <text x="10" y="17" fill="#38BDF8" font-size="11" class="mono">FastAPI</text>

      <rect x="84" y="0" width="108" height="26" rx="6" fill="#0B1A24" stroke="#1E293B" stroke-width="1"/>
      <text x="10" y="17" fill="#34D399" font-size="11" class="mono">MapLibre GL</text>

      <rect x="200" y="0" width="80" height="26" rx="6" fill="#0B1A24" stroke="#1E293B" stroke-width="1"/>
      <text x="10" y="17" fill="#818CF8" font-size="11" class="mono">Shapely</text>

      <rect x="288" y="0" width="74" height="26" rx="6" fill="#0B1A24" stroke="#1E293B" stroke-width="1"/>
      <text x="10" y="17" fill="#38BDF8" font-size="11" class="mono">React 18</text>

      <rect x="370" y="0" width="98" height="26" rx="6" fill="#0B1A24" stroke="#1E293B" stroke-width="1"/>
      <text x="10" y="17" fill="#F472B6" font-size="11" class="mono">SQLAlchemy</text>
    </g>
  </g>

  <!-- Vertical Divider -->
  <line x1="550" y1="34" x2="550" y2="286" stroke="#1E293B" stroke-width="1"/>

  <!-- Right Column: 4 Technical Pillars -->
  <g transform="translate(580, 34)">
    <text x="0" y="16" fill="#94A3B8" font-size="11" font-weight="700" class="mono" letter-spacing="1.2">TECHNICAL HIGHLIGHTS &amp; DEMO ARCHITECTURE</text>

    <!-- Grid 2x2 -->
    <!-- Tile 1: Dual-Temporal Imagery Studio -->
    <g transform="translate(0, 30)">
      <rect width="280" height="96" rx="8" fill="url(#lsTileBg)" stroke="#1E293B" stroke-width="1"/>
      <text x="14" y="24" fill="#34D399" font-size="13" font-weight="700" class="sans">Dual-Temporal Imagery Studio</text>
      <text x="14" y="44" fill="#94A3B8" font-size="11.5" class="sans">Swipe comparison of 2024 baseline vs 2026 drone orthomosaic imagery.</text>
      <text x="14" y="80" fill="#64748B" font-size="10" class="mono">Structure Footprint Detection</text>
    </g>

    <!-- Tile 2: Explainable Risk Engine -->
    <g transform="translate(294, 30)">
      <rect width="280" height="96" rx="8" fill="url(#lsTileBg)" stroke="#1E293B" stroke-width="1"/>
      <text x="14" y="24" fill="#38BDF8" font-size="13" font-weight="700" class="sans">Explainable Risk Engine</text>
      <text x="14" y="44" fill="#94A3B8" font-size="11.5" class="sans">Transparent 0-100 scoring based on master plan mismatch &amp; buffer proximity.</text>
      <text x="14" y="80" fill="#64748B" font-size="10" class="mono">Weighted Decision-Support</text>
    </g>

    <!-- Tile 3: Guided 5-Step Story Demo -->
    <g transform="translate(0, 138)">
      <rect width="280" height="96" rx="8" fill="url(#lsTileBg)" stroke="#1E293B" stroke-width="1"/>
      <text x="14" y="24" fill="#818CF8" font-size="13" font-weight="700" class="sans">Guided Demo (ULPIN-00421)</text>
      <text x="14" y="44" fill="#94A3B8" font-size="11.5" class="sans">Interactive scenario walking through agricultural land conflict verification.</text>
      <text x="14" y="80" fill="#64748B" font-size="10" class="mono">3D Volumetric Extrusion View</text>
    </g>

    <!-- Tile 4: 6-Role Server RBAC -->
    <g transform="translate(294, 138)">
      <rect width="280" height="96" rx="8" fill="url(#lsTileBg)" stroke="#1E293B" stroke-width="1"/>
      <text x="14" y="24" fill="#C084FC" font-size="13" font-weight="700" class="sans">Server-Enforced RBAC &amp; Audit</text>
      <text x="14" y="44" fill="#94A3B8" font-size="11.5" class="sans">6 discrete roles from Citizen to Auditor backed by immutable audit trail.</text>
      <text x="14" y="80" fill="#64748B" font-size="10" class="mono">Cryptographic Payload Integrity</text>
    </g>
  </g>
</svg>
