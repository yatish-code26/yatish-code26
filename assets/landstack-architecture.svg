      <text x="10" y="16" fill="#34D399" font-size="10" font-weight="600" class="mono">✓ Shapely Engine</text>

      <rect x="140" y="0" width="130" height="24" rx="5" fill="#0B201A" stroke="#133636"/>
      <text x="10" y="16" fill="#38BDF8" font-size="10" font-weight="600" class="mono">✓ MapLibre GL</text>

