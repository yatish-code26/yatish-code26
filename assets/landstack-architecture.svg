<svg width="100%" height="100%" viewBox="0 0 1000 320" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="lsBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#071217"/>
      <stop offset="60%" stop-color="#0B1A1E"/>
      <stop offset="100%" stop-color="#060F14"/>
    </linearGradient>

    <linearGradient id="lsBorder" x1="0%" y1="0%" x2="100%" y2="100%">
