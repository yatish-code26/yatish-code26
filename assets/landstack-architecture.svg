    <circle cx="12" cy="12" r="3.5" fill="#34D399"/>
    <text x="22" y="16" fill="#6EE7B7" font-size="10.5" font-weight="700" class="mono" letter-spacing="1">SIH 2026 // MASTER PROTOTYPE</text>

