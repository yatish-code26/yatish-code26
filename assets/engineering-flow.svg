<svg width="100%" height="100%" viewBox="0 0 1000 210" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="flowBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080C16"/>
      <stop offset="100%" stop-color="#0D1424"/>
    </linearGradient>

    <linearGradient id="flowBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#1E293B" stop-opacity="0.8"/>
    </linearGradient>

    <style>
      .mono { font-family: "JetBrains Mono", "Fira Code", Menlo, Consolas, monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, Helvetica, Arial, sans-serif; }
    </style>
  </defs>

  <!-- Container -->
  <rect width="1000" height="210" rx="14" fill="url(#flowBg)"/>
  <rect x="1" y="1" width="998" height="208" rx="13" fill="none" stroke="url(#flowBorder)" stroke-width="1.2"/>

  <!-- Header Title -->
  <g transform="translate(32, 26)">
    <rect x="0" y="0" width="160" height="22" rx="11" fill="#131C2E" stroke="#1E293B" stroke-width="1"/>
    <text x="12" y="15" fill="#38BDF8" font-size="10" font-weight="700" class="mono" letter-spacing="1.2">SYSTEM LIFECYCLE</text>
    <text x="175" y="16" fill="#F8FAFC" font-size="13" font-weight="600" class="sans">Engineering Lifecycle: From Domain Model to Production Gate</text>
    <text x="936" y="16" text-anchor="end" fill="#64748B" font-size="10.5" class="mono">REPRODUCIBLE • DEFENSIVE</text>
  </g>

  <!-- 6 Stages Grid -->
  <g transform="translate(32, 64)">
    <!-- Stage 1 -->
    <g transform="translate(0, 0)">
      <rect width="142" height="114" rx="8" fill="#121A2C" stroke="#1E293B" stroke-width="1"/>
      <text x="12" y="24" fill="#38BDF8" font-size="11" font-weight="700" class="mono">01 SPEC</text>
      <text x="12" y="44" fill="#FFFFFF" font-size="12" font-weight="700" class="sans">Requirements</text>
      <text x="12" y="66" fill="#94A3B8" font-size="10" class="sans">• Domain modeling</text>
      <text x="12" y="82" fill="#94A3B8" font-size="10" class="sans">• Edge case audit</text>
      <text x="12" y="98" fill="#94A3B8" font-size="10" class="sans">• API contracts</text>
    </g>
    <path d="M 145 56 L 153 56 M 150 52 L 154 56 L 150 60" stroke="#38BDF8" stroke-width="1.5" stroke-linecap="round"/>

    <!-- Stage 2 -->
    <g transform="translate(157, 0)">
      <rect width="142" height="114" rx="8" fill="#121A2C" stroke="#1E293B" stroke-width="1"/>
      <text x="12" y="24" fill="#60A5FA" font-size="11" font-weight="700" class="mono">02 ARCH</text>
      <text x="12" y="44" fill="#FFFFFF" font-size="12" font-weight="700" class="sans">Architecture</text>
      <text x="12" y="66" fill="#94A3B8" font-size="10" class="sans">• Postgres schemas</text>
      <text x="12" y="82" fill="#94A3B8" font-size="10" class="sans">• GIS geometry index</text>
      <text x="12" y="98" fill="#94A3B8" font-size="10" class="sans">• Edge function DTOs</text>
    </g>
    <path d="M 302 56 L 310 56 M 307 52 L 311 56 L 307 60" stroke="#60A5FA" stroke-width="1.5" stroke-linecap="round"/>

    <!-- Stage 3 -->
    <g transform="translate(314, 0)">
      <rect width="142" height="114" rx="8" fill="#121A2C" stroke="#1E293B" stroke-width="1"/>
      <text x="12" y="24" fill="#818CF8" font-size="11" font-weight="700" class="mono">03 BUILD</text>
      <text x="12" y="44" fill="#FFFFFF" font-size="12" font-weight="700" class="sans">Implementation</text>
      <text x="12" y="66" fill="#94A3B8" font-size="10" class="sans">• React 19 / Native</text>
      <text x="12" y="82" fill="#94A3B8" font-size="10" class="sans">• FastAPI async core</text>
      <text x="12" y="98" fill="#94A3B8" font-size="10" class="sans">• Streaming AI SDKs</text>
    </g>
    <path d="M 459 56 L 467 56 M 464 52 L 468 56 L 464 60" stroke="#818CF8" stroke-width="1.5" stroke-linecap="round"/>

    <!-- Stage 4 -->
    <g transform="translate(471, 0)">
      <rect width="142" height="114" rx="8" fill="#121A2C" stroke="#1E293B" stroke-width="1"/>
      <text x="12" y="24" fill="#A78BFA" font-size="11" font-weight="700" class="mono">04 SEC</text>
      <text x="12" y="44" fill="#FFFFFF" font-size="12" font-weight="700" class="sans">Zero-Trust Sec</text>
      <text x="12" y="66" fill="#94A3B8" font-size="10" class="sans">• PostgreSQL RLS</text>
      <text x="12" y="82" fill="#94A3B8" font-size="10" class="sans">• 6-Role server RBAC</text>
      <text x="12" y="98" fill="#94A3B8" font-size="10" class="sans">• Vault secret isolation</text>
    </g>
    <path d="M 616 56 L 624 56 M 621 52 L 625 56 L 621 60" stroke="#A78BFA" stroke-width="1.5" stroke-linecap="round"/>

    <!-- Stage 5 -->
    <g transform="translate(628, 0)">
      <rect width="142" height="114" rx="8" fill="#121A2C" stroke="#1E293B" stroke-width="1"/>
      <text x="12" y="24" fill="#34D399" font-size="11" font-weight="700" class="mono">05 QA</text>
      <text x="12" y="44" fill="#FFFFFF" font-size="12" font-weight="700" class="sans">Verification</text>
      <text x="12" y="66" fill="#94A3B8" font-size="10" class="sans">• Vitest &amp; RTL suites</text>
      <text x="12" y="82" fill="#94A3B8" font-size="10" class="sans">• Async pytest engines</text>
      <text x="12" y="98" fill="#94A3B8" font-size="10" class="sans">• Strict 0 TS errors</text>
    </g>
    <path d="M 773 56 L 781 56 M 778 52 L 782 56 L 778 60" stroke="#34D399" stroke-width="1.5" stroke-linecap="round"/>

    <!-- Stage 6 -->
    <g transform="translate(785, 0)">
      <rect width="151" height="114" rx="8" fill="#121A2C" stroke="#1E293B" stroke-width="1"/>
      <text x="12" y="24" fill="#F472B6" font-size="11" font-weight="700" class="mono">06 PROD</text>
      <text x="12" y="44" fill="#FFFFFF" font-size="12" font-weight="700" class="sans">Deployment</text>
      <text x="12" y="66" fill="#94A3B8" font-size="10" class="sans">• Workbox PWA</text>
      <text x="12" y="82" fill="#94A3B8" font-size="10" class="sans">• Edge function runtime</text>
      <text x="12" y="98" fill="#94A3B8" font-size="10" class="sans">• Multi-format audit logs</text>
    </g>
  </g>
</svg>
