<svg width="100%" height="100%" viewBox="0 0 1000 270" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="tmBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080C16"/>
      <stop offset="100%" stop-color="#0E1526"/>
    </linearGradient>

    <linearGradient id="tmBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#1E293B" stop-opacity="0.8"/>
    </linearGradient>

    <style>
      .mono { font-family: "JetBrains Mono", "Fira Code", Menlo, Consolas, monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, Helvetica, Arial, sans-serif; }
    </style>
  </defs>

  <!-- Container -->
  <rect width="1000" height="270" rx="14" fill="url(#tmBg)"/>
  <rect x="1" y="1" width="998" height="268" rx="13" fill="none" stroke="url(#tmBorder)" stroke-width="1.2"/>

  <!-- Title Header -->
  <g transform="translate(32, 26)">
    <rect x="0" y="0" width="185" height="22" rx="11" fill="#131C2E" stroke="#1E293B" stroke-width="1"/>
    <text x="12" y="15" fill="#38BDF8" font-size="10" font-weight="700" class="mono" letter-spacing="1.2">VERIFIED TECH STACK</text>
    <text x="200" y="16" fill="#F8FAFC" font-size="13" font-weight="600" class="sans">Architecture-Level Technologies in Active Use</text>
    <text x="936" y="16" text-anchor="end" fill="#64748B" font-size="10.5" class="mono">VERIFIED AGAINST REPOSITORIES</text>
  </g>

  <!-- 5 Columns -->
  <g transform="translate(32, 62)">
    <!-- Col 1 -->
    <g transform="translate(0, 0)">
      <rect width="180" height="184" rx="8" fill="#111827" stroke="#1E293B" stroke-width="1"/>
      <text x="12" y="24" fill="#38BDF8" font-size="10" font-weight="700" class="mono">01 AI &amp; INTEL</text>
      <text x="12" y="50" fill="#E2E8F0" font-size="11" font-weight="600" class="sans">• Google Gemini API</text>
      <text x="12" y="72" fill="#E2E8F0" font-size="11" font-weight="600" class="sans">• Groq / Llama Core</text>
      <text x="12" y="94" fill="#E2E8F0" font-size="11" font-weight="600" class="sans">• LangChain SDKs</text>
      <text x="12" y="116" fill="#E2E8F0" font-size="11" font-weight="600" class="sans">• Context Prompting</text>
      <text x="12" y="138" fill="#E2E8F0" font-size="11" font-weight="600" class="sans">• Edge AI Streaming</text>
      <text x="12" y="164" fill="#64748B" font-size="9.5" class="mono">Layer: Inference</text>
    </g>

    <!-- Col 2 -->
    <g transform="translate(190, 0)">
      <rect width="180" height="184" rx="8" fill="#111827" stroke="#1E293B" stroke-width="1"/>
      <text x="12" y="24" fill="#818CF8" font-size="10" font-weight="700" class="mono">02 CLIENT &amp; APP</text>
      <text x="12" y="50" fill="#E2E8F0" font-size="11" font-weight="600" class="sans">• React 19 / TS</text>
      <text x="12" y="72" fill="#E2E8F0" font-size="11" font-weight="600" class="sans">• React Native / Expo</text>
      <text x="12" y="94" fill="#E2E8F0" font-size="11" font-weight="600" class="sans">• Vite &amp; Tailwind CSS</text>
      <text x="12" y="116" fill="#E2E8F0" font-size="11" font-weight="600" class="sans">• Radix UI / Shadcn</text>
      <text x="12" y="138" fill="#E2E8F0" font-size="11" font-weight="600" class="sans">• Workbox PWA</text>
      <text x="12" y="164" fill="#64748B" font-size="9.5" class="mono">Layer: Cross-Platform</text>
    </g>

    <!-- Col 3 -->
    <g transform="translate(380, 0)">
      <rect width="180" height="184" rx="8" fill="#111827" stroke="#1E293B" stroke-width="1"/>
      <text x="12" y="24" fill="#34D399" font-size="10" font-weight="700" class="mono">03 BACKEND &amp; DATA</text>
      <text x="12" y="50" fill="#E2E8F0" font-size="11" font-weight="600" class="sans">• PostgreSQL Database</text>
      <text x="12" y="72" fill="#E2E8F0" font-size="11" font-weight="600" class="sans">• Row Level Security</text>
      <text x="12" y="94" fill="#E2E8F0" font-size="11" font-weight="600" class="sans">• FastAPI (Python 3)</text>
      <text x="12" y="116" fill="#E2E8F0" font-size="11" font-weight="600" class="sans">• Supabase Edge Runtimes</text>
      <text x="12" y="138" fill="#E2E8F0" font-size="11" font-weight="600" class="sans">• Realtime WebSockets</text>
      <text x="12" y="164" fill="#64748B" font-size="9.5" class="mono">Layer: Persistence</text>
    </g>

    <!-- Col 4 -->
    <g transform="translate(570, 0)">
      <rect width="180" height="184" rx="8" fill="#111827" stroke="#1E293B" stroke-width="1"/>
      <text x="12" y="24" fill="#FBBF24" font-size="10" font-weight="700" class="mono">04 GIS &amp; SPATIAL</text>
      <text x="12" y="50" fill="#E2E8F0" font-size="11" font-weight="600" class="sans">• MapLibre GL JS</text>
      <text x="12" y="72" fill="#E2E8F0" font-size="11" font-weight="600" class="sans">• Shapely (Geometry)</text>
      <text x="12" y="94" fill="#E2E8F0" font-size="11" font-weight="600" class="sans">• Cadastral Polygons</text>
      <text x="12" y="116" fill="#E2E8F0" font-size="11" font-weight="600" class="sans">• Eco-Buffer Checks</text>
      <text x="12" y="138" fill="#E2E8F0" font-size="11" font-weight="600" class="sans">• Dual-Temporal Drone</text>
      <text x="12" y="164" fill="#64748B" font-size="9.5" class="mono">Layer: Geospatial</text>
    </g>

    <!-- Col 5 -->
    <g transform="translate(760, 0)">
      <rect width="176" height="184" rx="8" fill="#111827" stroke="#1E293B" stroke-width="1"/>
      <text x="12" y="24" fill="#F472B6" font-size="10" font-weight="700" class="mono">05 QA &amp; TEST GATES</text>
      <text x="12" y="50" fill="#E2E8F0" font-size="11" font-weight="600" class="sans">• Vitest &amp; RTL Suites</text>
      <text x="12" y="72" fill="#E2E8F0" font-size="11" font-weight="600" class="sans">• Parameterized Pytest</text>
      <text x="12" y="94" fill="#E2E8F0" font-size="11" font-weight="600" class="sans">• 0 TS Error Guarantee</text>
      <text x="12" y="116" fill="#E2E8F0" font-size="11" font-weight="600" class="sans">• Ruff &amp; Mypy Typecheck</text>
      <text x="12" y="138" fill="#E2E8F0" font-size="11" font-weight="600" class="sans">• Git &amp; GitHub Flow</text>
      <text x="12" y="164" fill="#64748B" font-size="9.5" class="mono">Layer: Verification</text>
    </g>
  </g>
</svg>
