<svg width="100%" height="100%" viewBox="0 0 1200 300" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="tmBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080C16"/>
      <stop offset="100%" stop-color="#0E1526"/>
    </linearGradient>

    <linearGradient id="tmBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#1E293B" stop-opacity="0.8"/>
    </linearGradient>

    <linearGradient id="tierBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#141E33" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.5"/>
    </linearGradient>

    <style>
      .mono { font-family: "JetBrains Mono", "Fira Code", Menlo, Consolas, monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, Helvetica, Arial, sans-serif; }
    </style>
  </defs>

  <!-- Container -->
  <rect width="1200" height="300" rx="14" fill="url(#tmBg)"/>
  <rect x="1" y="1" width="1198" height="298" rx="13" fill="none" stroke="url(#tmBorder)" stroke-width="1.2"/>

  <!-- Title Header -->
  <g transform="translate(36, 28)">
    <rect x="0" y="0" width="195" height="24" rx="12" fill="#131C2E" stroke="#1E293B" stroke-width="1"/>
    <text x="12" y="16" fill="#38BDF8" font-size="11" font-weight="700" class="mono" letter-spacing="1.2">VERIFIED TECH STACK</text>
    <text x="210" y="17" fill="#F8FAFC" font-size="14" font-weight="600" class="sans">Architecture-Level Technologies in Active Use</text>
    <text x="1128" y="17" text-anchor="end" fill="#64748B" font-size="11" class="mono">VERIFIED AGAINST REPOSITORIES</text>
  </g>

  <!-- 5 Architecture Columns -->
  <g transform="translate(36, 68)">
    <!-- Column 1: AI & Intelligence -->
    <g transform="translate(0, 0)">
      <rect width="216" height="204" rx="8" fill="url(#tierBg)" stroke="#1E293B" stroke-width="1"/>
      <rect x="12" y="12" width="192" height="26" rx="4" fill="#0C2033" stroke="#0284C7" stroke-width="0.8"/>
      <text x="20" y="29" fill="#38BDF8" font-size="11" font-weight="700" class="mono">01 // AI &amp; INTELLIGENCE</text>
      
      <g transform="translate(14, 52)">
        <text x="0" y="14" fill="#E2E8F0" font-size="12" font-weight="600" class="sans">• Google Gemini (Streaming)</text>
        <text x="0" y="38" fill="#E2E8F0" font-size="12" font-weight="600" class="sans">• Groq / Llama (Live Plan)</text>
        <text x="0" y="62" fill="#E2E8F0" font-size="12" font-weight="600" class="sans">• LangChain Framework</text>
        <text x="0" y="86" fill="#E2E8F0" font-size="12" font-weight="600" class="sans">• Context-Aware Prompting</text>
        <text x="0" y="110" fill="#E2E8F0" font-size="12" font-weight="600" class="sans">• Edge AI Function Invocations</text>
        <text x="0" y="134" fill="#94A3B8" font-size="11" class="mono">Layer: Inference &amp; Reasoning</text>
      </g>
    </g>

    <!-- Column 2: Frontend & Mobile -->
    <g transform="translate(228, 0)">
      <rect width="216" height="204" rx="8" fill="url(#tierBg)" stroke="#1E293B" stroke-width="1"/>
      <rect x="12" y="12" width="192" height="26" rx="4" fill="#171836" stroke="#6366F1" stroke-width="0.8"/>
      <text x="20" y="29" fill="#818CF8" font-size="11" font-weight="700" class="mono">02 // CLIENT &amp; MOBILE</text>

      <g transform="translate(14, 52)">
        <text x="0" y="14" fill="#E2E8F0" font-size="12" font-weight="600" class="sans">• React 19 / TypeScript</text>
        <text x="0" y="38" fill="#E2E8F0" font-size="12" font-weight="600" class="sans">• React Native &amp; Expo</text>
        <text x="0" y="62" fill="#E2E8F0" font-size="12" font-weight="600" class="sans">• Vite &amp; Tailwind CSS</text>
        <text x="0" y="86" fill="#E2E8F0" font-size="12" font-weight="600" class="sans">• Radix UI / Shadcn Patterns</text>
        <text x="0" y="110" fill="#E2E8F0" font-size="12" font-weight="600" class="sans">• Workbox PWA (Offline)</text>
        <text x="0" y="134" fill="#94A3B8" font-size="11" class="mono">Layer: Cross-Platform UI</text>
      </g>
    </g>

    <!-- Column 3: Backend & Cloud -->
    <g transform="translate(456, 0)">
      <rect width="216" height="204" rx="8" fill="url(#tierBg)" stroke="#1E293B" stroke-width="1"/>
      <rect x="12" y="12" width="192" height="26" rx="4" fill="#06281E" stroke="#10B981" stroke-width="0.8"/>
      <text x="20" y="29" fill="#34D399" font-size="11" font-weight="700" class="mono">03 // BACKEND &amp; DATA</text>

      <g transform="translate(14, 52)">
        <text x="0" y="14" fill="#E2E8F0" font-size="12" font-weight="600" class="sans">• Supabase / PostgreSQL</text>
        <text x="0" y="38" fill="#E2E8F0" font-size="12" font-weight="600" class="sans">• Row Level Security (RLS)</text>
        <text x="0" y="62" fill="#E2E8F0" font-size="12" font-weight="600" class="sans">• FastAPI &amp; Python 3</text>
        <text x="0" y="86" fill="#E2E8F0" font-size="12" font-weight="600" class="sans">• Supabase Edge Functions</text>
        <text x="0" y="110" fill="#E2E8F0" font-size="12" font-weight="600" class="sans">• Realtime WebSocket Sync</text>
        <text x="0" y="134" fill="#94A3B8" font-size="11" class="mono">Layer: Cloud &amp; Persistence</text>
      </g>
    </g>

    <!-- Column 4: GIS & Geospatial -->
    <g transform="translate(684, 0)">
      <rect width="216" height="204" rx="8" fill="url(#tierBg)" stroke="#1E293B" stroke-width="1"/>
      <rect x="12" y="12" width="192" height="26" rx="4" fill="#241B08" stroke="#D97706" stroke-width="0.8"/>
      <text x="20" y="29" fill="#FBBF24" font-size="11" font-weight="700" class="mono">04 // GIS &amp; SPATIAL</text>

      <g transform="translate(14, 52)">
        <text x="0" y="14" fill="#E2E8F0" font-size="12" font-weight="600" class="sans">• MapLibre GL JS</text>
        <text x="0" y="38" fill="#E2E8F0" font-size="12" font-weight="600" class="sans">• Shapely (Python Geometry)</text>
        <text x="0" y="62" fill="#E2E8F0" font-size="12" font-weight="600" class="sans">• Cadastral Parcel Bounds</text>
        <text x="0" y="86" fill="#E2E8F0" font-size="12" font-weight="600" class="sans">• Eco-Sensitive Buffers</text>
        <text x="0" y="110" fill="#E2E8F0" font-size="12" font-weight="600" class="sans">• Dual-Temporal Drone Diff</text>
        <text x="0" y="134" fill="#94A3B8" font-size="11" class="mono">Layer: Spatial Intelligence</text>
      </g>
    </g>

    <!-- Column 5: Testing & QA -->
    <g transform="translate(912, 0)">
      <rect width="216" height="204" rx="8" fill="url(#tierBg)" stroke="#1E293B" stroke-width="1"/>
      <rect x="12" y="12" width="192" height="26" rx="4" fill="#240D24" stroke="#C026D3" stroke-width="0.8"/>
      <text x="20" y="29" fill="#F472B6" font-size="11" font-weight="700" class="mono">05 // TESTING &amp; TOOLING</text>

      <g transform="translate(14, 52)">
        <text x="0" y="14" fill="#E2E8F0" font-size="12" font-weight="600" class="sans">• Vitest &amp; RTL</text>
        <text x="0" y="38" fill="#E2E8F0" font-size="12" font-weight="600" class="sans">• Pytest Async Engines</text>
        <text x="0" y="62" fill="#E2E8F0" font-size="12" font-weight="600" class="sans">• Strict 0 TS Errors</text>
        <text x="0" y="86" fill="#E2E8F0" font-size="12" font-weight="600" class="sans">• Ruff &amp; Mypy Typecheck</text>
        <text x="0" y="110" fill="#E2E8F0" font-size="12" font-weight="600" class="sans">• Git &amp; GitHub Workflows</text>
        <text x="0" y="134" fill="#94A3B8" font-size="11" class="mono">Layer: Verification Gates</text>
      </g>
    </g>
  </g>
</svg>
