<svg width="100%" height="100%" viewBox="0 0 1200 380" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="rxBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090E1B"/>
      <stop offset="60%" stop-color="#0E1629"/>
      <stop offset="100%" stop-color="#080C17"/>
    </linearGradient>

    <linearGradient id="rxBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7" stop-opacity="0.8"/>
      <stop offset="40%" stop-color="#38BDF8" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0.8"/>
    </linearGradient>

    <linearGradient id="rxGlow" cx="20%" cy="20%" r="50%">
      <stop offset="0%" stop-color="#0284C7" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="tileBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#141E33" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.5"/>
    </linearGradient>

    <style>
      .mono { font-family: "JetBrains Mono", "Fira Code", Menlo, Consolas, monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, Helvetica, Arial, sans-serif; }
    </style>
  </defs>

  <!-- Container -->
  <rect width="1200" height="380" rx="16" fill="url(#rxBg)"/>
  <rect x="1" y="1" width="1198" height="378" rx="15" fill="none" stroke="url(#rxBorder)" stroke-width="1.5"/>

  <!-- Left Column: Core Identity & Architecture -->
  <g transform="translate(44, 38)">
    <!-- Badge -->
    <rect x="0" y="0" width="280" height="26" rx="13" fill="#0C1D33" stroke="#0284C7" stroke-width="1"/>
    <circle cx="14" cy="13" r="4" fill="#38BDF8"/>
    <text x="26" y="17" fill="#7DD3FC" font-size="11" font-weight="700" class="mono" letter-spacing="1">FLAGSHIP PROJECT // AUDITED v1.0</text>

    <!-- Project Title -->
    <text x="0" y="66" fill="#FFFFFF" font-size="34" font-weight="800" class="sans" letter-spacing="-0.8">
      RouteX
    </text>
    <text x="145" y="64" fill="#38BDF8" font-size="15" font-weight="600" class="mono">
      ✈️ TRAVEL INTELLIGENCE &amp; SAFETY
    </text>

    <!-- Description -->
    <text x="0" y="100" fill="#CBD5E1" font-size="14.5" font-weight="400" class="sans" width="460">
      A cross-platform travel companion uniting AI trip planning, real-time safety,
    </text>
    <text x="0" y="122" fill="#CBD5E1" font-size="14.5" font-weight="400" class="sans">
      and offline-first synchronization across Web and Mobile ecosystems.
    </text>

    <!-- Key Architecture Specs Box -->
    <g transform="translate(0, 144)">
      <rect width="470" height="114" rx="10" fill="#0D1629" stroke="#1E293B" stroke-width="1"/>
      
      <text x="16" y="26" fill="#38BDF8" font-size="11" font-weight="700" class="mono">UNIFIED CROSS-PLATFORM SYSTEM ARCHITECTURE</text>
      
      <circle cx="22" cy="48" r="3" fill="#60A5FA"/>
      <text x="34" y="52" fill="#E2E8F0" font-size="12" class="sans"><tspan font-weight="600">Web Client:</tspan> React 19, TypeScript, Vite, Tailwind CSS, Workbox PWA</text>

      <circle cx="22" cy="72" r="3" fill="#818CF8"/>
      <text x="34" y="76" fill="#E2E8F0" font-size="12" class="sans"><tspan font-weight="600">Mobile Client:</tspan> React Native, Expo, Shared Context &amp; Auth Models</text>

      <circle cx="22" cy="96" r="3" fill="#34D399"/>
      <text x="34" y="100" fill="#E2E8F0" font-size="12" class="sans"><tspan font-weight="600">Backend Cloud:</tspan> Supabase PostgreSQL, Edge Functions, RLS, Realtime WS</text>
    </g>

    <!-- Production Quality Markers -->
    <g transform="translate(0, 276)">
      <rect x="0" y="0" width="144" height="28" rx="6" fill="#0E1E2E" stroke="#1E293B" stroke-width="1"/>
      <text x="12" y="18" fill="#34D399" font-size="11" font-weight="600" class="mono">✓ 0 TypeScript Errors</text>

      <rect x="156" y="0" width="144" height="28" rx="6" fill="#0E1E2E" stroke="#1E293B" stroke-width="1"/>
      <text x="12" y="18" fill="#38BDF8" font-size="11" font-weight="600" class="mono">✓ Vitest Test Suite</text>

      <rect x="312" y="0" width="158" height="28" rx="6" fill="#0E1E2E" stroke="#1E293B" stroke-width="1"/>
      <text x="12" y="18" fill="#A78BFA" font-size="11" font-weight="600" class="mono">✓ Strict Postgres RLS</text>
    </g>
  </g>

  <!-- Vertical Divider -->
  <line x1="550" y1="38" x2="550" y2="342" stroke="#1E293B" stroke-width="1"/>

  <!-- Right Column: 6 Technical Capabilities Grid -->
  <g transform="translate(580, 38)">
    <text x="0" y="16" fill="#94A3B8" font-size="11" font-weight="700" class="mono" letter-spacing="1.2">ENGINEERED CAPABILITIES &amp; HIGHLIGHTS</text>

    <!-- Grid 2x3 -->
    <!-- Tile 1: AI Engines -->
    <g transform="translate(0, 30)">
      <rect width="280" height="84" rx="8" fill="url(#tileBg)" stroke="#1E293B" stroke-width="1"/>
      <text x="14" y="24" fill="#38BDF8" font-size="13" font-weight="700" class="sans">Dual AI Engine Pipeline</text>
      <text x="14" y="44" fill="#94A3B8" font-size="11.5" class="sans">Google Gemini streaming assistant + Groq/Llama Live Plan generators.</text>
      <text x="14" y="66" fill="#64748B" font-size="10" class="mono">Streaming Edge Functions</text>
    </g>

    <!-- Tile 2: Optimistic Realtime -->
    <g transform="translate(294, 30)">
      <rect width="280" height="84" rx="8" fill="url(#tileBg)" stroke="#1E293B" stroke-width="1"/>
      <text x="14" y="24" fill="#60A5FA" font-size="13" font-weight="700" class="sans">Optimistic Realtime UI</text>
      <text x="14" y="44" fill="#94A3B8" font-size="11.5" class="sans">Instant mutation feedback on itineraries, bypassing WS latency.</text>
      <text x="14" y="66" fill="#64748B" font-size="10" class="mono">Supabase Realtime Channels</text>
    </g>

    <!-- Tile 3: Zero-Trust Document Vault -->
    <g transform="translate(0, 126)">
      <rect width="280" height="84" rx="8" fill="url(#tileBg)" stroke="#1E293B" stroke-width="1"/>
      <text x="14" y="24" fill="#818CF8" font-size="13" font-weight="700" class="sans">Zero-Trust Document Vault</text>
      <text x="14" y="44" fill="#94A3B8" font-size="11.5" class="sans">Local &amp; cloud storage for passports &amp; visas isolated via Postgres RLS.</text>
      <text x="14" y="66" fill="#64748B" font-size="10" class="mono">Row-Level Security Policies</text>
    </g>

    <!-- Tile 4: Emergency SOS Net -->
    <g transform="translate(294, 126)">
      <rect width="280" height="84" rx="8" fill="url(#tileBg)" stroke="#1E293B" stroke-width="1"/>
      <text x="14" y="24" fill="#F87171" font-size="13" font-weight="700" class="sans">Emergency SOS Safety Net</text>
      <text x="14" y="44" fill="#94A3B8" font-size="11.5" class="sans">Instant emergency contact alert dispatch &amp; offline local assistance.</text>
      <text x="14" y="66" fill="#64748B" font-size="10" class="mono">Offline-first Workbox PWA</text>
    </g>

    <!-- Tile 5: Budget Allocator -->
    <g transform="translate(0, 222)">
      <rect width="280" height="84" rx="8" fill="url(#tileBg)" stroke="#1E293B" stroke-width="1"/>
      <text x="14" y="24" fill="#34D399" font-size="13" font-weight="700" class="sans">Dynamic Budget Allocator</text>
      <text x="14" y="44" fill="#94A3B8" font-size="11.5" class="sans">Multi-currency conversion, expense tracking &amp; group splitting.</text>
      <text x="14" y="66" fill="#64748B" font-size="10" class="mono">Realtime Ledger Calculations</text>
    </g>

    <!-- Tile 6: Multi-Format Data Portability -->
    <g transform="translate(294, 222)">
      <rect width="280" height="84" rx="8" fill="url(#tileBg)" stroke="#1E293B" stroke-width="1"/>
      <text x="14" y="24" fill="#C084FC" font-size="13" font-weight="700" class="sans">Multi-Format Portability</text>
      <text x="14" y="44" fill="#94A3B8" font-size="11.5" class="sans">Native browser HTML-to-PDF print rendering, CSV &amp; JSON data export.</text>
      <text x="14" y="66" fill="#64748B" font-size="10" class="mono">Self-Sovereign Data Export</text>
    </g>
  </g>
</svg>
