<svg width="100%" height="100%" viewBox="0 0 1200 380" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070A12"/>
      <stop offset="50%" stop-color="#0B1120"/>
      <stop offset="100%" stop-color="#060911"/>
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="cyanIndigo" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#C084FC"/>
    </linearGradient>

    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.6"/>
      <stop offset="30%" stop-color="#1E293B" stop-opacity="0.3"/>
      <stop offset="70%" stop-color="#1E293B" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#818CF8" stop-opacity="0.6"/>
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#131B2E" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.4"/>
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#F1F5F9"/>
      <stop offset="100%" stop-color="#94A3B8"/>
    </linearGradient>

    <!-- Radial Glows -->
    <radialGradient id="glowTopLeft" cx="15%" cy="10%" r="40%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glowBottomRight" cx="85%" cy="90%" r="45%">
      <stop offset="0%" stop-color="#818CF8" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#818CF8" stop-opacity="0"/>
    </radialGradient>

    <!-- Subtle Grid Pattern -->
    <pattern id="gridPattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1E293B" stroke-width="0.75" stroke-opacity="0.5"/>
      <circle cx="40" cy="40" r="1" fill="#38BDF8" fill-opacity="0.25"/>
    </pattern>

    <style>
      .mono { font-family: "JetBrains Mono", "Fira Code", Menlo, Consolas, monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, Helvetica, Arial, sans-serif; }
      
      @keyframes pulseDot {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.4; transform: scale(0.9); }
      }
      .pulsing {
        animation: pulseDot 2.4s ease-in-out infinite;
        transform-origin: center;
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="380" rx="16" fill="url(#bgGrad)"/>
  <rect width="1200" height="380" rx="16" fill="url(#gridPattern)"/>
  <rect width="1200" height="380" rx="16" fill="url(#glowTopLeft)"/>
  <rect width="1200" height="380" rx="16" fill="url(#glowBottomRight)"/>

  <!-- Border -->
  <rect x="1" y="1" width="1198" height="378" rx="15" fill="none" stroke="url(#borderGrad)" stroke-width="1.5"/>

  <!-- Corner Accents -->
  <path d="M 12 28 L 12 12 L 28 12" fill="none" stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 1188 28 L 1188 12 L 1172 12" fill="none" stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 12 352 L 12 368 L 28 368" fill="none" stroke="#818CF8" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 1188 352 L 1188 368 L 1172 368" fill="none" stroke="#818CF8" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Top Metadata Bar -->
  <g transform="translate(48, 42)">
    <!-- Status Badge -->
    <rect x="0" y="0" width="232" height="30" rx="15" fill="#0E1726" stroke="#1E293B" stroke-width="1"/>
    <circle cx="16" cy="15" r="4.5" fill="#10B981" class="pulsing"/>
    <circle cx="16" cy="15" r="7.5" fill="none" stroke="#10B981" stroke-width="1" stroke-opacity="0.4"/>
    <text x="30" y="19.5" fill="#A7F3D0" font-size="11" font-weight="600" class="mono" letter-spacing="1.2">SYSTEM ACTIVE // BUILDER</text>

    <!-- Handle & Spec -->
    <rect x="244" y="0" width="168" height="30" rx="15" fill="#0E1726" stroke="#1E293B" stroke-width="1"/>
    <text x="258" y="19.5" fill="#94A3B8" font-size="11" font-weight="500" class="mono">ID: @yatish-code26</text>

    <!-- Right Side Spec -->
    <text x="1104" y="19.5" text-anchor="end" fill="#64748B" font-size="11" font-weight="500" class="mono">CORE PIPELINE // v2.6</text>
  </g>

  <!-- Hero Content Center -->
  <g transform="translate(48, 105)">
    <!-- Main Title -->
    <text x="0" y="52" fill="url(#textGrad)" font-size="54" font-weight="800" class="sans" letter-spacing="-1.5">
      YATISH P
    </text>

    <!-- Subtitle Role Badge -->
    <text x="310" y="44" fill="url(#cyanIndigo)" font-size="15" font-weight="700" class="mono" letter-spacing="2.2">
      // AI • FULL-STACK • PRODUCT BUILDER • OPEN SOURCE
    </text>

    <!-- Mission Statement -->
    <text x="0" y="96" fill="#E2E8F0" font-size="18" font-weight="500" class="sans" letter-spacing="-0.2">
      Building real technical systems from idea → architecture → security → deployment.
    </text>
    <text x="0" y="122" fill="#94A3B8" font-size="14" font-weight="400" class="sans">
      Focused on production-grade AI applications, GIS public infrastructure, and resilient full-stack architectures.
    </text>
  </g>

  <!-- Horizontal Divider Line with Accent Diamond -->
  <line x1="48" y1="262" x2="1152" y2="262" stroke="#1E293B" stroke-width="1"/>
  <line x1="48" y1="262" x2="280" y2="262" stroke="url(#cyanIndigo)" stroke-width="1.5"/>
  <polygon points="280,259 283,262 280,265 277,262" fill="#38BDF8"/>

  <!-- Bottom Architecture Pillars (4 Cards) -->
  <g transform="translate(48, 280)">
    <!-- Card 1: RouteX Ecosystem -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="264" height="66" rx="8" fill="url(#cardGrad)" stroke="#1E293B" stroke-width="1"/>
      <circle cx="24" cy="24" r="8" fill="#38BDF8" fill-opacity="0.12"/>
      <path d="M 20 24 L 23 27 L 29 21" stroke="#38BDF8" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="40" y="27" fill="#F8FAFC" font-size="13" font-weight="700" class="sans">RouteX Travel Platform</text>
      <text x="40" y="48" fill="#94A3B8" font-size="11" font-weight="400" class="mono">React 19 + Native + Supabase</text>
    </g>

    <!-- Card 2: LandStack DPI -->
    <g transform="translate(280, 0)">
      <rect x="0" y="0" width="264" height="66" rx="8" fill="url(#cardGrad)" stroke="#1E293B" stroke-width="1"/>
      <circle cx="24" cy="24" r="8" fill="#818CF8" fill-opacity="0.12"/>
      <path d="M 24 18 L 30 24 L 24 30 L 18 24 Z" stroke="#818CF8" stroke-width="1.5" fill="none"/>
      <text x="40" y="27" fill="#F8FAFC" font-size="13" font-weight="700" class="sans">LandStack GIS Infra</text>
      <text x="40" y="48" fill="#94A3B8" font-size="11" font-weight="400" class="mono">FastAPI + MapLibre + Shapely</text>
    </g>

    <!-- Card 3: IncidentIQ Intelligence -->
    <g transform="translate(560, 0)">
      <rect x="0" y="0" width="264" height="66" rx="8" fill="url(#cardGrad)" stroke="#1E293B" stroke-width="1"/>
      <circle cx="24" cy="24" r="8" fill="#38BDF8" fill-opacity="0.12"/>
      <path d="M 19 28 L 24 19 L 29 28 Z" stroke="#38BDF8" stroke-width="1.5" fill="none"/>
      <circle cx="24" cy="25" r="1.5" fill="#38BDF8"/>
      <text x="40" y="27" fill="#F8FAFC" font-size="13" font-weight="700" class="sans">IncidentIQ Cloud Intel</text>
      <text x="40" y="48" fill="#94A3B8" font-size="11" font-weight="400" class="mono">Command Center + Simulation</text>
    </g>

    <!-- Card 4: LangChain Open Source -->
    <g transform="translate(840, 0)">
      <rect x="0" y="0" width="264" height="66" rx="8" fill="url(#cardGrad)" stroke="#1E293B" stroke-width="1"/>
      <circle cx="24" cy="24" r="8" fill="#C084FC" fill-opacity="0.12"/>
      <path d="M 20 22 C 20 20 22 18 24 18 C 26 18 28 20 28 22 C 28 25 24 28 24 28 L 20 28" stroke="#C084FC" stroke-width="1.5" stroke-linecap="round"/>
      <text x="40" y="27" fill="#F8FAFC" font-size="13" font-weight="700" class="sans">LangChain Contributor</text>
      <text x="40" y="48" fill="#94A3B8" font-size="11" font-weight="400" class="mono">Anthropic Models + Pytest</text>
    </g>
  </g>
</svg>
