<svg width="100%" height="100%" viewBox="0 0 585 290" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="iiqBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090E1A"/>
      <stop offset="100%" stop-color="#0E1526"/>
    </linearGradient>

    <linearGradient id="iiqBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#1E293B" stop-opacity="0.4"/>
    </linearGradient>

    <style>
      .mono { font-family: "JetBrains Mono", "Fira Code", Menlo, Consolas, monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, Helvetica, Arial, sans-serif; }
    </style>
  </defs>

  <!-- Container -->
  <rect width="585" height="290" rx="14" fill="url(#iiqBg)"/>
  <rect x="1" y="1" width="583" height="288" rx="13" fill="none" stroke="url(#iiqBorder)" stroke-width="1.2"/>

  <!-- Content -->
  <g transform="translate(28, 28)">
    <!-- Badge -->
    <rect x="0" y="0" width="225" height="24" rx="12" fill="#0C2033" stroke="#0284C7" stroke-width="1"/>
    <circle cx="12" cy="12" r="3.5" fill="#38BDF8"/>
    <text x="22" y="16" fill="#7DD3FC" font-size="10.5" font-weight="700" class="mono" letter-spacing="0.8">MICROSOFT HACKATHON</text>

    <!-- Title -->
    <text x="0" y="60" fill="#FFFFFF" font-size="24" font-weight="800" class="sans" letter-spacing="-0.5">
      IncidentIQ
    </text>
    <text x="135" y="58" fill="#38BDF8" font-size="12" font-weight="600" class="mono">
      CLOUD INCIDENT INTEL
    </text>

    <!-- Subtitle -->
    <text x="0" y="86" fill="#CBD5E1" font-size="13" class="sans">
      Cloud incident intelligence and command-center system designed
    </text>
    <text x="0" y="106" fill="#CBD5E1" font-size="13" class="sans">
      for real-time diagnostic reasoning and telemetry analysis.
    </text>

    <!-- Demo Controls Box -->
    <g transform="translate(0, 126)">
      <rect width="529" height="58" rx="8" fill="#0A1220" stroke="#1E293B" stroke-width="1"/>
      <text x="14" y="20" fill="#94A3B8" font-size="10" font-weight="700" class="mono">DEMO INCIDENT SIMULATION CONTROLS</text>
      
      <!-- Control Badges -->
      <g transform="translate(14, 28)">
        <rect x="0" y="0" width="128" height="20" rx="4" fill="#0C243B" stroke="#0284C7" stroke-width="0.8"/>
        <text x="8" y="14" fill="#38BDF8" font-size="9.5" font-weight="600" class="mono">▶ SIMULATE INCIDENT</text>

        <rect x="136" y="0" width="60" height="20" rx="4" fill="#1E293B"/>
        <text x="8" y="14" fill="#CBD5E1" font-size="9.5" class="mono">⏸ PAUSE</text>

        <rect x="204" y="0" width="68" height="20" rx="4" fill="#1E293B"/>
        <text x="8" y="14" fill="#CBD5E1" font-size="9.5" class="mono">▶ RESUME</text>

        <rect x="280" y="0" width="60" height="20" rx="4" fill="#1E293B"/>
        <text x="8" y="14" fill="#CBD5E1" font-size="9.5" class="mono">↺ RESET</text>
      </g>
    </g>

    <!-- Technical Pillars -->
    <g transform="translate(0, 198)">
      <circle cx="6" cy="10" r="3" fill="#38BDF8"/>
      <text x="16" y="14" fill="#E2E8F0" font-size="12" class="sans">AI-assisted anomaly reasoning &amp; incident severity scoring</text>

      <circle cx="6" cy="30" r="3" fill="#60A5FA"/>
      <text x="16" y="34" fill="#E2E8F0" font-size="12" class="sans">Command-center interface with telemetry stream inspection</text>
    </g>
  </g>
</svg>
