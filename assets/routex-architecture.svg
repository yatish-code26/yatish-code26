<svg width="100%" height="100%" viewBox="0 0 1000 320" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="rxBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080E1C"/>
      <stop offset="60%" stop-color="#0D1629"/>
      <stop offset="100%" stop-color="#070C18"/>
    </linearGradient>

    <linearGradient id="rxBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#818CF8" stop-opacity="0.8"/>
    </linearGradient>

    <style>
      .mono { font-family: "JetBrains Mono", "Fira Code", Menlo, Consolas, monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, Helvetica, Arial, sans-serif; }
    </style>
  </defs>

  <!-- Container -->
  <rect width="1000" height="320" rx="14" fill="url(#rxBg)"/>
  <rect x="1" y="1" width="998" height="318" rx="13" fill="none" stroke="url(#rxBorder)" stroke-width="1.2"/>

  <!-- Left Header & Specs -->
  <g transform="translate(36, 32)">
    <rect x="0" y="0" width="230" height="24" rx="12" fill="#0C2036" stroke="#0284C7" stroke-width="1"/>
    <circle cx="12" cy="12" r="3.5" fill="#38BDF8"/>
    <text x="22" y="16" fill="#7DD3FC" font-size="10.5" font-weight="700" class="mono" letter-spacing="1">FLAGSHIP // AUDITED v1.0</text>

    <text x="0" y="60" fill="#FFFFFF" font-size="28" font-weight="800" class="sans" letter-spacing="-0.5">
      RouteX Ecosystem
    </text>
    <text x="0" y="82" fill="#38BDF8" font-size="12.5" font-weight="600" class="mono">
      AI-POWERED TRAVEL INTELLIGENCE &amp; SAFETY PLATFORM
    </text>

    <text x="0" y="112" fill="#94A3B8" font-size="13" class="sans">
      Unified cross-platform architecture serving Web and Mobile from a single Supabase backend.
    </text>

    <!-- Specs Container -->
    <g transform="translate(0, 136)">
      <rect width="420" height="84" rx="8" fill="#0B1324" stroke="#1E293B" stroke-width="1"/>
      <text x="14" y="22" fill="#E2E8F0" font-size="11.5" class="sans">
        <tspan font-weight="700" fill="#38BDF8">Web Client:</tspan> React 19 • TypeScript • Vite • Workbox PWA
      </text>
      <text x="14" y="44" fill="#E2E8F0" font-size="11.5" class="sans">
        <tspan font-weight="700" fill="#818CF8">Mobile Client:</tspan> React Native • Expo • Notch-Safe Insets
      </text>
      <text x="14" y="66" fill="#E2E8F0" font-size="11.5" class="sans">
        <tspan font-weight="700" fill="#34D399">Cloud Data:</tspan> PostgreSQL • Zero-Trust RLS • Edge Functions
      </text>
    </g>

    <!-- Verified Badges -->
    <g transform="translate(0, 236)">
      <rect x="0" y="0" width="130" height="24" rx="5" fill="#0E232E" stroke="#1E293B"/>
      <text x="10" y="16" fill="#34D399" font-size="10" font-weight="600" class="mono">✓ 0 TS Errors</text>

      <rect x="140" y="0" width="130" height="24" rx="5" fill="#0E232E" stroke="#1E293B"/>
      <text x="10" y="16" fill="#38BDF8" font-size="10" font-weight="600" class="mono">✓ Vitest Passing</text>

      <rect x="280" y="0" width="140" height="24" rx="5" fill="#0E232E" stroke="#1E293B"/>
      <text x="10" y="16" fill="#A78BFA" font-size="10" font-weight="600" class="mono">✓ Postgres RLS</text>
    </g>
  </g>

  <!-- Vertical Dividing Line -->
  <line x1="490" y1="32" x2="490" y2="288" stroke="#1E293B" stroke-width="1"/>

  <!-- Right Architecture Nodes (4 Tiles) -->
  <g transform="translate(520, 32)">
    <text x="0" y="16" fill="#64748B" font-size="10.5" font-weight="700" class="mono" letter-spacing="1">
      ENGINEERED SUBSYSTEMS
    </text>

    <!-- Tile 1 -->
    <g transform="translate(0, 28)">
      <rect width="444" height="52" rx="8" fill="#0D1629" stroke="#1E293B" stroke-width="1"/>
      <text x="14" y="22" fill="#38BDF8" font-size="12" font-weight="700" class="sans">Dual AI Orchestration Pipeline</text>
      <text x="14" y="38" fill="#94A3B8" font-size="10.5" class="sans">Google Gemini streaming companion + Groq/Llama Live Plan synthesizer.</text>
    </g>

    <!-- Tile 2 -->
    <g transform="translate(0, 88)">
      <rect width="444" height="52" rx="8" fill="#0D1629" stroke="#1E293B" stroke-width="1"/>
      <text x="14" y="22" fill="#60A5FA" font-size="12" font-weight="700" class="sans">Optimistic Realtime State Engine</text>
      <text x="14" y="38" fill="#94A3B8" font-size="10.5" class="sans">Zero perceived latency on itinerary mutations over Supabase Realtime channels.</text>
    </g>

    <!-- Tile 3 -->
    <g transform="translate(0, 148)">
      <rect width="444" height="52" rx="8" fill="#0D1629" stroke="#1E293B" stroke-width="1"/>
      <text x="14" y="22" fill="#818CF8" font-size="12" font-weight="700" class="sans">Zero-Trust Document Vault &amp; Passports</text>
      <text x="14" y="38" fill="#94A3B8" font-size="10.5" class="sans">PostgreSQL Row-Level Security encrypting identity &amp; ticket storage.</text>
    </g>

    <!-- Tile 4 -->
    <g transform="translate(0, 208)">
      <rect width="444" height="52" rx="8" fill="#0D1629" stroke="#1E293B" stroke-width="1"/>
      <text x="14" y="22" fill="#F87171" font-size="12" font-weight="700" class="sans">Emergency SOS Safety Net</text>
      <text x="14" y="38" fill="#94A3B8" font-size="10.5" class="sans">One-touch dispatch &amp; offline emergency cache via Workbox Service Workers.</text>
    </g>
  </g>
</svg>
