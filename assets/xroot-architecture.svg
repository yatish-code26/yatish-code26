<svg width="100%" height="100%" viewBox="0 0 1000 260" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="xrBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070E1A"/>
      <stop offset="60%" stop-color="#0C1626"/>
      <stop offset="100%" stop-color="#060C16"/>
    </linearGradient>

    <linearGradient id="xrBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#818CF8" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#34D399" stop-opacity="0.8"/>
    </linearGradient>

    <style>
      .mono { font-family: "JetBrains Mono", "Fira Code", Menlo, Consolas, monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, Helvetica, Arial, sans-serif; }
    </style>
  </defs>

  <!-- Container -->
  <rect width="1000" height="260" rx="14" fill="url(#xrBg)"/>
  <rect x="1" y="1" width="998" height="258" rx="13" fill="none" stroke="url(#xrBorder)" stroke-width="1.2"/>

  <!-- Left Header & Specs -->
  <g transform="translate(36, 28)">
    <rect x="0" y="0" width="220" height="24" rx="12" fill="#0C2036" stroke="#38BDF8" stroke-width="1"/>
    <circle cx="12" cy="12" r="3.5" fill="#38BDF8"/>
    <text x="22" y="16" fill="#7DD3FC" font-size="10.5" font-weight="700" class="mono" letter-spacing="0.8">ON-DEVICE AI RESEARCH</text>

    <text x="0" y="60" fill="#FFFFFF" font-size="26" font-weight="800" class="sans" letter-spacing="-0.5">
      Xroot
    </text>
    <text x="0" y="80" fill="#38BDF8" font-size="12.5" font-weight="600" class="mono">
      SELF-EVOLVING ON-DEVICE ADAPTIVE AI LAYER
    </text>

    <text x="0" y="106" fill="#94A3B8" font-size="13" class="sans">
      Led as Team Leader. Dynamically selects computation models based on device telemetry.
    </text>

    <!-- Loop Diagram Box -->
    <g transform="translate(0, 126)">
      <rect width="420" height="52" rx="8" fill="#0A1422" stroke="#1E293B" stroke-width="1"/>
      <text x="14" y="20" fill="#64748B" font-size="9.5" font-weight="700" class="mono">ADAPTIVE FEEDBACK PIPELINE</text>
      <text x="14" y="38" fill="#34D399" font-size="11" font-weight="600" class="mono">
        Observe ➔ Predict ➔ Plan ➔ Execute ➔ Learn
      </text>
    </g>

    <g transform="translate(0, 194)">
      <text x="0" y="16" fill="#38BDF8" font-size="10.5" font-weight="600" class="mono">
        ✓ Team Leadership  •  ✓ Dynamic Compute Budgeting  •  ✓ Device State Optimization
      </text>
    </g>
  </g>

  <!-- Dividing Line -->
  <line x1="490" y1="28" x2="490" y2="232" stroke="#1E293B" stroke-width="1"/>

  <!-- Right Side Telemetry Tradeoffs -->
  <g transform="translate(520, 28)">
    <text x="0" y="16" fill="#64748B" font-size="10.5" font-weight="700" class="mono" letter-spacing="1">
      TELEMETRY-AWARE BALANCING ENGINE
    </text>

    <g transform="translate(0, 30)">
      <rect width="444" height="52" rx="8" fill="#0C1726" stroke="#1E293B" stroke-width="1"/>
      <text x="14" y="22" fill="#38BDF8" font-size="12" font-weight="700" class="sans">Real-Time State Sensing</text>
      <text x="14" y="38" fill="#94A3B8" font-size="10.5" class="sans">Monitors battery levels, thermal throttling, NPU occupancy, and network latency.</text>
    </g>

    <g transform="translate(0, 90)">
      <rect width="444" height="52" rx="8" fill="#0C1726" stroke="#1E293B" stroke-width="1"/>
      <text x="14" y="22" fill="#818CF8" font-size="12" font-weight="700" class="sans">Dynamic Pipeline Adaptation</text>
      <text x="14" y="38" fill="#94A3B8" font-size="10.5" class="sans">Shifts between edge inference, cloud fallback, or quantized models based on state.</text>
    </g>

    <g transform="translate(0, 150)">
      <rect width="444" height="52" rx="8" fill="#0C1726" stroke="#1E293B" stroke-width="1"/>
      <text x="14" y="22" fill="#34D399" font-size="12" font-weight="700" class="sans">Continual Quality Optimization</text>
      <text x="14" y="38" fill="#94A3B8" font-size="10.5" class="sans">Learns recurring user interaction patterns to pre-plan compute and avoid latency spikes.</text>
    </g>
  </g>
</svg>
